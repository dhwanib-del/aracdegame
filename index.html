<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171522"><title>ARCADE.exe — Your room. Your hands. Your arcade.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet">
<style>
:root{--ink:#171522;--ink2:#241c2c;--cream:#f7e8c6;--gold:#f2be57;--red:#b93c30;--pink:#e77b3c;--burgundy:#5c2730}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#443047 0,#221927 45%,#15121c 100%);font-family:"DM Sans",sans-serif;color:var(--cream);min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:4px}.top{padding:20px clamp(16px,4vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff24}.logo{color:var(--gold);font-weight:900;font-size:22px;letter-spacing:-1px;background:none;border:0}.top button{color:var(--cream)}.text-btn{border:1px solid #ffffff49;background:#ffffff0b;border-radius:30px;padding:10px 15px}.wrap{max-width:1230px;margin:auto;padding:34px 20px 80px}.eyebrow{text-align:center;text-transform:uppercase;letter-spacing:4px;font-size:11px;font-weight:800;color:var(--gold)}h1,h2,h3{font-family:Fraunces,Georgia,serif}.hero h1{text-align:center;font-weight:900;font-size:clamp(70px,12vw,155px);line-height:1.04;letter-spacing:-7px;margin:12px 0 6px;text-shadow:0 8px 0 #54242c,0 12px 20px #000}.hero{text-align:center}.hero p{font-size:clamp(16px,2vw,21px);margin:5px 0 32px}.lights{display:flex;justify-content:center;gap:15px;margin:0 auto 25px}.light{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 15px #ffbe58}.light:nth-child(2n){background:#ff8279;box-shadow:0 0 15px #e15d49}.machines{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:980px;margin:0 auto}.machine{position:relative;border-radius:27px 27px 17px 17px;background:linear-gradient(120deg,#de653c,#9e302c 45%,#63202b);border:8px solid #3f1a27;box-shadow:0 14px 0 #271320,0 28px 30px #08040a90;min-height:425px;overflow:hidden;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:transform .2s}.machine:nth-child(2){background:linear-gradient(120deg,#d7a44a,#ad6234 48%,#6b3328)}.machine:hover{transform:translateY(-8px) rotate(-.5deg)}.machine h2{font-size:43px;margin:10px 0;text-shadow:2px 3px #541c26;text-align:center}.cabinet-top{border:3px double var(--gold);border-radius:50px;padding:4px 20px;letter-spacing:2px;font-weight:800;font-size:11px}.screen{width:90%;max-width:400px;height:200px;background:radial-gradient(#584b55,#1a1827);border:12px ridge #d9a65e;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.preview-hoop{font-size:112px;filter:drop-shadow(0 8px 4px #0007)}.preview-ball{position:absolute;font-size:61px;bottom:2px;right:17%;transform:rotate(-15deg)}.preview-skee{font-size:100px}.primary{border:2px solid #4d2422;background:linear-gradient(#ffe0a0,#f1b858);padding:15px 28px;border-radius:9px;color:#422423;font-weight:900;box-shadow:0 6px 0 #713825;text-transform:uppercase;letter-spacing:1px}.primary:hover{filter:brightness(1.08);transform:translateY(-2px)}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #713825}.machine footer{font-size:12px;font-weight:800;letter-spacing:2px}.center{text-align:center}.section-title{font-size:clamp(32px,5vw,55px);text-align:center;margin:16px 0 10px}.lead{max-width:620px;margin:5px auto 28px;color:#e5d3ba;text-align:center;line-height:1.7}.panel{max-width:760px;margin:0 auto;background:linear-gradient(140deg,#402f3f,#261f2f);padding:clamp(20px,4vw,36px);border:1px solid #ffdb9d52;border-radius:20px;box-shadow:0 16px 40px #0004}.options{display:grid;grid-template-columns:1fr 1fr;gap:15px}.option{background:#ffffff0a;border:1px solid #ffffff40;color:var(--cream);padding:35px 15px;border-radius:18px;text-align:center;min-height:190px}.option:hover{background:#ffffff20;border-color:var(--gold)}.option .emoji{font-size:55px;display:block;margin-bottom:12px}.option strong{display:block;font-size:20px}.option small{display:block;font-size:13px;line-height:1.6;margin-top:9px}.muted{opacity:.75;font-size:13px}.space{height:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.game-shell{max-width:1050px;margin:auto}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.stat{background:#171520;border:1px solid #d7a25270;border-radius:13px;padding:10px 22px;text-align:center}.stat label{font-weight:800;color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;display:block}.stat strong{display:block;font-family:Fraunces,serif;font-size:38px}.stage{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;border:10px solid #a45036;outline:3px solid #dbb37f;border-radius:20px;background:#201b2e;box-shadow:0 18px 35px #0007;touch-action:none}.stage canvas{display:block;width:100%;height:100%;cursor:crosshair}.stage video{position:absolute;bottom:14px;right:14px;width:130px;border:2px solid var(--gold);border-radius:9px;transform:scaleX(-1);opacity:.76;pointer-events:none}.hint{margin:20px 0;text-align:center;color:#e6d1ae;font-size:14px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}.meter{background:#111;border:1px solid var(--gold);border-radius:10px;width:170px;height:16px;overflow:hidden}.meter-fill{background:var(--gold);height:100%;width:45%}.ticket{margin:22px auto;max-width:460px;background:var(--cream);color:#482729;padding:32px 28px;text-align:center;box-shadow:0 12px 0 #deae67;clip-path:polygon(0 0,100% 0,100% 96%,96% 100%,92% 96%,88% 100%,84% 96%,80% 100%,76% 96%,72% 100%,68% 96%,64% 100%,60% 96%,56% 100%,52% 96%,48% 100%,44% 96%,40% 100%,36% 96%,32% 100%,28% 96%,24% 100%,20% 96%,16% 100%,12% 96%,8% 100%,4% 96%,0 100%)}.ticket h2{font-size:48px;margin:7px 0}.ticket .score{font:900 95px/1 Fraunces,serif;color:#af3930}.ticket hr{border:0;border-top:2px dashed #b37d5d;margin:18px 0}.badge{background:#bd3d33;color:white;padding:8px 14px;display:inline-block;transform:rotate(-4deg);font-weight:900}.privacy{padding:16px;border:1px solid #9f8d83;border-radius:12px;line-height:1.6}.camera-box{border:2px solid #9c6952;border-radius:14px;min-height:260px;background:#111;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.camera-box video{width:100%;max-height:350px;transform:scaleX(-1)}.status{color:var(--gold);font-weight:800}.modal-bg{position:fixed;inset:0;background:#0b0711cf;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#332538;border:2px solid var(--gold);padding:28px;border-radius:18px;width:min(95vw,480px)}.modal label{display:block;margin:16px 0}.modal input{width:100%}.modal button{margin:6px}.link{border:0;color:var(--gold);background:none;text-decoration:underline;margin:12px}.confetti{position:fixed;pointer-events:none;inset:0}footer.bottom{margin-top:45px;text-align:center;opacity:.6;font-size:12px;letter-spacing:2px}@media(max-width:700px){.machines,.options{grid-template-columns:1fr}.machine{min-height:365px}.hero h1{letter-spacing:-3px}.hud{gap:5px}.stat{padding:9px 2px}.stat strong{font-size:27px}.stage{aspect-ratio:4/4}.wrap{padding:25px 12px 50px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head>
<body><header class="top"><button class="logo" id="home">✦ ARCADE.exe</button><div><button class="text-btn" id="help">How to play</button> <button class="text-btn" id="settings">⚙ Settings</button></div></header><main class="wrap" id="app"></main>
<script type="module">
const $=s=>document.querySelector(s),app=$('#app');
const S={screen:'lobby',game:'hoops',mode:'manual',score:0,best:JSON.parse(localStorage.getItem('arcade-best-v1')||'{}'),remaining:60,shots:0,hits:0,streak:0,longest:0,power:.55,aim:.5,shooting:false,animation:0,clock:0,running:false,paused:false,balls:9,result:'',handTracker:null,video:null,stream:null,cameraRaf:0,pinch:false,tracking:false,cameraError:'',lastHandX:.5,lastHandY:.5,frame:0};
const settings={sound:true,sensitivity:1};
function tone(f=500){if(!settings.sound)return;try{let a=tone.ctx||(tone.ctx=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch(e){}}
function render(){S.screen==='lobby'?lobby():S.screen==='mode'?mode():S.screen==='camera'?camera():S.screen==='ready'?ready():S.screen==='game'?game():results()}
function nav(x){if(x!=='game'&&x!=='camera')stopGame();if(x==='lobby'||x==='mode')stopCamera();S.screen=x;render()}
function lobby(){app.innerHTML='<section class="hero"><div class="lights">'+Array.from({length:21},()=>'<i class="light"></i>').join('')+'</div><div class="eyebrow">★ WELCOME TO THE CARNIVAL ★</div><h1>ARCADE<span style="color:#f2be57">.</span>exe</h1><p>Your room. Your hands. Your arcade.</p></section><div class="machines"><article class="machine"><span class="cabinet-top">PLAYER ONE · GAME 01</span><h2>HOOP DREAMS</h2><div class="screen"><span class="preview-hoop">🏀</span><span class="preview-ball">✨</span></div><p>60 seconds. Unlimited shots. Big energy.</p><button class="primary" id="hoops">LET’S SHOOT →</button><footer>SKILL + SPEED / 01</footer></article><article class="machine"><span class="cabinet-top">PLAYER ONE · GAME 02</span><h2>ROLL WITH IT</h2><div class="screen"><span class="preview-skee">🎯</span><span class="preview-ball">⚪</span></div><p>Nine balls. Find your angle. Win big.</p><button class="primary" id="skee">LET’S ROLL →</button><footer>PRECISION + CONTROL / 02</footer></article></div><footer class="bottom">NO DOWNLOADS • NO ACCOUNT • JUST PLAY</footer>';$('#hoops').onclick=()=>select('hoops');$('#skee').onclick=()=>select('skee')}
function select(g){S.game=g;tone();nav('mode')}
function mode(){app.innerHTML='<div class="eyebrow">STEP 01 / PICK YOUR CONTROLS</div><h2 class="section-title">How do you want to play?</h2><p class="lead">Your '+(S.game==='hoops'?'Hoop Dreams':'Roll With It')+' machine is ready. Choose your control style.</p><div class="panel"><div class="options"><button class="option" id="hand"><span class="emoji">🖐️</span><strong>Play with your hands</strong><small>Use your laptop webcam and pinch to throw. MediaPipe tracks your hand right in your browser.</small></button><button class="option" id="mouse"><span class="emoji">🖱️</span><strong>Mouse + keyboard</strong><small>No camera needed. Move to aim, click or press Space to shoot.</small></button></div><p class="privacy muted">🔒 Camera frames are processed on your device. This game does not upload or save your video.</p><div class="center"><button class="link" id="back">← Back to arcade</button></div></div>';$('#hand').onclick=()=>{S.mode='camera';nav('camera')};$('#mouse').onclick=()=>{S.mode='manual';nav('ready')};$('#back').onclick=()=>nav('lobby')}
function camera(){app.innerHTML='<div class="eyebrow">STEP 02 / CAMERA SETUP</div><h2 class="section-title">Show us your hand!</h2><p class="lead">Hold one hand where the webcam can see it. Pinch your thumb and index finger together, then open to release.</p><div class="panel"><div class="camera-box" id="cam"><span id="camhint">Your camera is currently off.</span></div><p class="status" id="track">● Waiting for camera</p><div class="controls"><button class="primary" id="enable">ENABLE CAMERA</button><button class="text-btn" id="continue" disabled>CONTINUE →</button><button class="text-btn" id="manual">Use mouse instead</button></div><p class="muted center">Camera processing stays local. Bright, even lighting works best.</p></div>';$('#enable').onclick=startCamera;$('#continue').onclick=()=>nav('ready');$('#manual').onclick=()=>{S.mode='manual';stopCamera();nav('ready')}}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera needs HTTPS or localhost.');$('#track').textContent='Starting camera…';S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});const vid=document.createElement('video');vid.autoplay=true;vid.muted=true;vid.playsInline=true;vid.srcObject=S.stream;$('#cam').innerHTML='';$('#cam').append(vid);await vid.play();S.video=vid;$('#track').textContent='Camera on — loading hand tracker…';const mp=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');const vision=await mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');S.handTracker=await mp.HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});S.frame=0;trackHand();$('#enable').textContent='CAMERA ON';$('#enable').disabled=true;$('#continue').disabled=false;$('#track').textContent='● Looking for a hand — pinch to try it!'}catch(e){S.cameraError=e.message;const t=$('#track');if(t)t.textContent='Could not start hand tracking: '+e.message+'. You can use mouse controls.';if(S.stream)stopCamera()}}
function trackHand(){if(!S.handTracker||!S.video)return;const loop=()=>{if(!S.video||!S.handTracker)return;try{if(S.video.readyState>=2){let r=S.handTracker.detectForVideo(S.video,performance.now());let hand=r.landmarks?.[0];S.tracking=!!hand;if(hand){let thumb=hand[4],index=hand[8],palm=hand[9],sideA=hand[5],sideB=hand[17];let width=Math.hypot(sideA.x-sideB.x,sideA.y-sideB.y)||.1;let d=Math.hypot(thumb.x-index.x,thumb.y-index.y)/width;let was=S.pinch;S.pinch=d<(was?.53:.32);S.aim=Math.max(.05,Math.min(.95,1-palm.x));S.power=Math.max(.12,Math.min(.95,1-palm.y));S.lastHandX=palm.x;S.lastHandY=palm.y;if(was&&!S.pinch&&S.screen==='game'&&!S.paused)shoot();let status=$('#track');if(status)status.textContent='● Hand detected · '+(S.pinch?'PINCHED':'OPEN')+' · ready to '+(S.pinch?'hold':'release')}else{S.pinch=false;let status=$('#track');if(status)status.textContent='● Camera on · show one hand to play'}}}catch(e){}S.cameraRaf=requestAnimationFrame(loop)};S.cameraRaf=requestAnimationFrame(loop)}
function stopCamera(){cancelAnimationFrame(S.cameraRaf);S.cameraRaf=0;S.handTracker?.close?.();S.handTracker=null;S.video=null;S.stream?.getTracks().forEach(t=>t.stop());S.stream=null;S.tracking=false}
function ready(){app.innerHTML='<div class="eyebrow">STEP 03 / PLAYER BRIEFING</div><h2 class="section-title">'+(S.game==='hoops'?'Shoot your shot.':'Ready, set, roll!')+'</h2><div class="panel center"><div style="font-size:90px;margin:20px">'+(S.game==='hoops'?'🏀':'🎯')+'</div><h3 style="font-size:29px">'+(S.game==='hoops'?'60 seconds on the clock':'Nine balls. Make them count.')+'</h3><p class="lead">'+(S.mode==='camera'?'Move your hand to aim and set power. Pinch, then open your fingers to release the ball.':'Move your pointer over the game to aim. Slide your mouse higher for more power. Click or press Space to launch.')+'</p><p class="muted">For accessibility: mouse + keyboard remains available in camera mode.</p><button class="primary" id="begin">START GAME →</button><p><button class="link" id="back">← Change controls</button></p></div>';$('#begin').onclick=()=>{reset();nav('game')};$('#back').onclick=()=>nav('mode')}
function reset(){stopGame();S.score=0;S.remaining=60;S.balls=9;S.shots=0;S.hits=0;S.streak=0;S.longest=0;S.shooting=false;S.paused=false;S.result='';S.power=.55;S.aim=.5}
let ctx,canvas,last=0,raf=0,clockInterval=0,shots=[];
function stopGame(){S.running=false;cancelAnimationFrame(raf);clearInterval(clockInterval);shots=[]}
function game(){app.innerHTML='<div class="game-shell"><div class="eyebrow">NOW PLAYING / '+(S.game==='hoops'?'HOOP DREAMS':'ROLL WITH IT')+'</div><h2 class="section-title" style="margin:5px 0 13px">'+(S.game==='hoops'?'🏀 HOOP DREAMS':'🎯 ROLL WITH IT')+'</h2><div class="hud"><div class="stat"><label>Score</label><strong id="score">0</strong></div><div class="stat"><label>'+(S.game==='hoops'?'Time':'Balls left')+'</label><strong id="time">'+(S.game==='hoops'?'60':'9')+'</strong></div><div class="stat"><label>'+(S.game==='hoops'?'Streak':'Best')+'</label><strong id="third">'+(S.game==='hoops'?'0':S.best.skee||0)+'</strong></div></div><div class="stage"><canvas id="canvas" width="1000" height="562" aria-label="Game playfield"></canvas><div id="gamecam"></div></div><p class="hint" id="gamehint">Aim with your pointer • click or Space to throw • P to pause</p><div class="controls"><button class="text-btn" id="pause">⏸ PAUSE</button><button class="text-btn" id="exit">← ARCADE</button><span class="muted">POWER</span><div class="meter"><div class="meter-fill" id="power"></div></div></div></div>';canvas=$('#canvas');ctx=canvas.getContext('2d');canvas.addEventListener('pointermove',e=>{if(S.mode==='camera'&&S.tracking)return;let b=canvas.getBoundingClientRect();S.aim=Math.max(.05,Math.min(.95,(e.clientX-b.left)/b.width));S.power=Math.max(.15,Math.min(.95,1-(e.clientY-b.top)/b.height))});canvas.addEventListener('pointerdown',()=>{if(!S.paused)shoot()});$('#pause').onclick=pause;$('#exit').onclick=()=>nav('lobby');if(S.mode==='camera'&&S.video){let v=S.video;v.remove();v.style.cssText='';$('#gamecam').append(v)}S.running=true;last=performance.now();raf=requestAnimationFrame(draw);if(S.game==='hoops')clockInterval=setInterval(()=>{if(S.paused||!S.running)return;S.remaining=Math.max(0,S.remaining-1);if(S.remaining===0){S.running=false;setTimeout(()=>finish(),1000)}update()},1000)}
function update(){let el=$('#score');if(!el)return;el.textContent=S.score;$('#time').textContent=S.game==='hoops'?S.remaining:S.balls;$('#third').textContent=S.game==='hoops'?S.streak:(S.best.skee||0);$('#power').style.width=(S.power*100)+'%'}
function draw(now){if(!S.running)return;let dt=Math.min((now-last)/1000,.06);last=now;if(!S.paused){renderStage(dt);update()}raf=requestAnimationFrame(draw)}
function renderStage(dt){let w=1000,h=562;ctx.clearRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#35263f');grad.addColorStop(1,'#161824');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.globalAlpha=.25;for(let i=0;i<20;i++){ctx.fillStyle='#ffde9c';ctx.beginPath();ctx.arc((i*73+22)%1000,55+(i*37)%225,2,0,7);ctx.fill()}ctx.globalAlpha=1;if(S.game==='hoops')renderHoops();else renderSkee();for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.t+=dt;let p=s.t/s.d;let x=s.x+(s.targetX-s.x)*p;let y=s.y+(s.targetY-s.y)*p-180*Math.sin(Math.PI*p);ctx.fillStyle=S.game==='hoops'?'#eb8c43':'#eee6d6';ctx.beginPath();ctx.arc(x,y,20*(1-Math.max(0,p-1)*.7),0,7);ctx.fill();if(S.game==='hoops'){ctx.strokeStyle='#853b23';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-12,y-12);ctx.lineTo(x+12,y+12);ctx.moveTo(x-12,y+12);ctx.lineTo(x+12,y-12);ctx.stroke()}if(p>=1){resolve(s);shots.splice(i,1)}}let x=100+S.aim*800;ctx.strokeStyle='#f2be57bb';ctx.setLineDash([6,10]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,h-56);ctx.lineTo(S.game==='hoops'?500:500,S.game==='hoops'?195:195);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f2be57';ctx.beginPath();ctx.arc(x,h-52,23,0,7);ctx.fill();ctx.fillStyle='#612f2a';ctx.font='30px sans-serif';ctx.textAlign='center';ctx.fillText(S.game==='hoops'?'●':'◉',x+1,h-43);ctx.fillStyle='#f7e8c6';ctx.font='bold 15px "DM Sans"';ctx.fillText(S.result,500,65)}
function renderHoops(){ctx.fillStyle='#74494b';ctx.fillRect(0,470,1000,92);ctx.strokeStyle='#e4a76d';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,470);ctx.lineTo(1000,470);ctx.stroke();ctx.fillStyle='#f7e8c6';ctx.fillRect(420,110,160,120);ctx.strokeStyle='#aa463c';ctx.lineWidth=12;ctx.strokeRect(420,110,160,120);ctx.strokeStyle='#f3a15b';ctx.lineWidth=12;ctx.beginPath();ctx.ellipse(500,234,65,17,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#e2cab5';ctx.lineWidth=2;for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(500+i*13,249);ctx.lineTo(500+i*10,318);ctx.stroke()}ctx.fillStyle='#c99d61';ctx.font='bold 18px "DM Sans"';ctx.textAlign='center';ctx.fillText('SWISH FOR +3',500,92)}
function renderSkee(){ctx.fillStyle='#8b4738';ctx.beginPath();ctx.moveTo(200,562);ctx.lineTo(320,190);ctx.lineTo(680,190);ctx.lineTo(800,562);ctx.closePath();ctx.fill();ctx.strokeStyle='#d7a96a';ctx.lineWidth=13;ctx.stroke();ctx.fillStyle='#402835';ctx.fillRect(283,80,434,165);let zones=[[365,115,100],[635,115,100],[500,113,50],[500,155,40],[500,201,30],[430,205,20],[570,205,20]];zones.forEach(([x,y,p])=>{ctx.fillStyle=p===100?'#f0bf56':'#f1dcad';ctx.beginPath();ctx.arc(x,y,p===100?29:24,0,7);ctx.fill();ctx.fillStyle='#542c2e';ctx.beginPath();ctx.arc(x,y,p===100?23:19,0,7);ctx.fill();ctx.fillStyle='#ffe9b5';ctx.font='bold 18px "DM Sans"';ctx.textAlign='center';ctx.fillText(p,x,y+6)});ctx.fillStyle='#ffdfad';ctx.font='bold 19px "DM Sans"';ctx.textAlign='center';ctx.fillText('CHOOSE YOUR ANGLE',500,52)}
function shoot(){if(!S.running||S.paused||S.remaining===0&&S.game==='hoops'||S.game==='skee'&&S.balls===0)return;S.shots++;if(S.game==='skee')S.balls--;let accuracy=Math.abs(S.aim-.5);let shot={x:100+800*S.aim,y:505,targetX:500+(S.aim-.5)*460,targetY:S.game==='hoops'?228:110+Math.round((1-S.power)*90),t:0,d:.55+(1-S.power)*.35,accuracy,power:S.power};shots.push(shot);S.result='SHOT AWAY!';tone(285);update()}
function resolve(s){if(S.game==='hoops'){let made=Math.abs(s.aim??S.aim-.5)<.2;made=s.accuracy<(.095+s.power*.13)&&s.power>.28;if(made){let swish=s.accuracy<.075;S.streak++;S.longest=Math.max(S.longest,S.streak);let pts=(swish?3:2)*(S.streak>=3?2:1);S.score+=pts;S.hits++;S.result=swish?'SWISH! +'+pts:'BUCKET! +'+pts;tone(740)}else{S.streak=0;S.result='SO CLOSE!';tone(195)}}else{let a=s.accuracy,p=s.power;let pts=p<.22?0:a<.07&&p>.77?50:a>.3&&p>.7?100:a<.12?40:a<.22?30:a<.32?20:10;S.score+=pts;if(pts)S.hits++;S.result=pts?('+'+pts+' POINTS!'):'ROLLED SHORT';tone(pts>=50?780:450);if(S.balls===0&&shots.length<=1)setTimeout(finish,900)}update()}
function finish(){if(S.screen!=='game')return;stopGame();let prev=S.best[S.game]||0;S.newBest=S.score>prev;if(S.newBest){S.best[S.game]=S.score;localStorage.setItem('arcade-best-v1',JSON.stringify(S.best))}stopCamera();nav('results')}
function results(){let accuracy=S.shots?Math.round(S.hits/S.shots*100):0;app.innerHTML='<div class="eyebrow">★ THE OFFICIAL ARCADE RECEIPT ★</div><h2 class="section-title">Look who showed up.</h2><div class="ticket" id="ticket"><p style="letter-spacing:4px">✦ OFFICIAL ARCADE TICKET ✦</p><h2>ARCADE.exe</h2><p style="font-weight:900">'+(S.game==='hoops'?'HOOP DREAMS':'ROLL WITH IT')+'</p><hr><p>YOUR FINAL SCORE</p><div class="score">'+S.score+'</div>'+(S.newBest?'<p class="badge">NEW PERSONAL BEST!</p>':'<p>PERSONAL BEST: '+(S.best[S.game]||0)+'</p>')+'<hr><div class="row"><span>Attempts</span><strong>'+S.shots+'</strong></div><div class="row"><span>Successful</span><strong>'+S.hits+'</strong></div><div class="row"><span>Accuracy</span><strong>'+accuracy+'%</strong></div><div class="row"><span>'+ (S.game==='hoops'?'Best streak':'Balls played')+'</span><strong>'+(S.game==='hoops'?S.longest:S.shots)+'</strong></div><hr><p>YOUR ROOM. YOUR HANDS. YOUR ARCADE.</p><p>★ ★ ★</p></div><div class="controls"><button class="primary" id="again">PLAY AGAIN ↻</button><button class="text-btn" id="change">CHANGE GAME</button><button class="text-btn" id="share">SHARE SCORE</button></div>';$('#again').onclick=()=>nav('mode');$('#change').onclick=()=>nav('lobby');$('#share').onclick=async()=>{let text='I scored '+S.score+' points on '+(S.game==='hoops'?'Hoop Dreams':'Roll With It')+' in ARCADE.exe!';if(navigator.share)await navigator.share({title:'ARCADE.exe',text,url:location.href}).catch(()=>{});else await navigator.clipboard.writeText(text+' '+location.href).then(()=>alert('Score copied!')).catch(()=>alert(text))}}
function pause(){S.paused=!S.paused;$('#pause').textContent=S.paused?'▶ RESUME':'⏸ PAUSE';$('#gamehint').textContent=S.paused?'GAME PAUSED':'Aim with your pointer • click or Space to throw • P to pause'}
function openSettings(){let d=document.createElement('div');d.className='modal-bg';d.innerHTML='<div class="modal"><h2>⚙ Arcade settings</h2><label><input type="checkbox" id="sound" '+(settings.sound?'checked':'')+'> Sound effects</label><label>Input sensitivity<input type="range" min=".5" max="1.8" step=".1" id="sens" value="'+settings.sensitivity+'"></label><button class="primary" id="done">DONE</button></div>';document.body.append(d);d.onclick=e=>{if(e.target===d)d.remove()};d.querySelector('#sound').onchange=e=>settings.sound=e.target.checked;d.querySelector('#sens').oninput=e=>settings.sensitivity=+e.target.value;d.querySelector('#done').onclick=()=>d.remove()}
$('#home').onclick=()=>nav('lobby');$('#settings').onclick=openSettings;$('#help').onclick=()=>alert('Pick a game, choose webcam or mouse, aim using your hand or pointer, then pinch-release or click/Space to throw. P pauses the round.');
document.addEventListener('keydown',e=>{if(e.code==='Escape'&&S.screen==='game')pause();if(e.code==='KeyP'&&S.screen==='game')pause();if(e.code==='Space'&&S.screen==='game'){e.preventDefault();shoot()}if(S.screen==='game'&&!S.paused){if(e.code==='ArrowLeft')S.aim=Math.max(.05,S.aim-.045*settings.sensitivity);if(e.code==='ArrowRight')S.aim=Math.min(.95,S.aim+.045*settings.sensitivity);if(e.code==='ArrowUp')S.power=Math.min(.95,S.power+.05*settings.sensitivity);if(e.code==='ArrowDown')S.power=Math.max(.15,S.power-.05*settings.sensitivity)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.screen==='game'&&!S.paused)pause()});window.addEventListener('beforeunload',stopCamera);render();
</script></body></html>
